<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Plot — a garden of tasks</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F4EFE5;
    --bg-2: #EDE6D8;
    --soil: #C9B79A;
    --soil-deep: #A88E68;
    --ink: #3A352B;
    --ink-2: #6E665A;
    --ink-3: #A39B8C;
    --line: #DCD3BF;
    --line-2: #E7DFCC;
    --sage: #8FA68E;
    --sage-deep: #6E866D;
    --pink: #E3B6B6;
    --butter: #E8D49C;
    --lavender: #C9BFD9;
    --terracotta: #D9A593;
    --sky: #B9CBD3;
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 8px 28px rgba(58,53,43,.06), 0 1px 2px rgba(58,53,43,.05);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  .serif { font-family: "Newsreader", ui-serif, Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .mono-num { font-variant-numeric: tabular-nums; }

  /* paper texture: subtle dotted noise */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(rgba(58,53,43,.025) 1px, transparent 1px),
      radial-gradient(rgba(58,53,43,.018) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
  }
  #app { position: relative; z-index: 1; }

  button { font-family: inherit; cursor: default; }
  input, textarea, select { font-family: inherit; color: inherit; }

  /* utility scrollbar */
  .scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(58,53,43,.18); border-radius: 4px; }

  @keyframes sway {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate( 1.2deg); }
  }
  @keyframes sway-2 {
    0%, 100% { transform: rotate( 1.5deg); }
    50%      { transform: rotate(-1.5deg); }
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes bloom-pop {
    0%   { transform: scale(.4); opacity: 0; }
    60%  { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes petal-burst {
    0%   { transform: translate(0,0) scale(.3); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
  }
  @keyframes ripple {
    0%   { transform: scale(.4); opacity: .6; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  @keyframes panel-in {
    from { transform: translateX(24px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes scale-in {
    from { transform: scale(.96); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @keyframes butterfly {
    0%   { transform: translate(0, 0) rotate(-6deg); }
    25%  { transform: translate(40px, -18px) rotate(8deg); }
    50%  { transform: translate(72px, 6px) rotate(-4deg); }
    75%  { transform: translate(36px, 22px) rotate(6deg); }
    100% { transform: translate(0, 0) rotate(-6deg); }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="plants.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="components2.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
